<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="barcode">
      <div class="bars">
        <!-- начало -->
        <i class="long s0 w1"></i><i class="long s1 w1"></i>
        <!-- левая половина, 6 цифр -->
        <i class="s1 w3"></i><i class="s1 w2"></i><i class="s1 w1"></i><i class="s3 w2"></i
        ><i class="s2 w1"></i><i class="s2 w2"></i> <i class="s1 w1"></i><i class="s1 w4"></i
        ><i class="s2 w2"></i><i class="s2 w1"></i><i class="s1 w3"></i><i class="s1 w2"></i>
        <!-- середина -->
        <i class="long s1 w1"></i><i class="long s1 w1"></i>
        <!-- правая половина, 6 цифр -->
        <i class="s1 w3"></i><i class="s2 w1"></i><i class="s1 w3"></i><i class="s2 w1"></i
        ><i class="s1 w3"></i><i class="s2 w1"></i> <i class="s1 w3"></i><i class="s2 w1"></i
        ><i class="s1 w2"></i><i class="s1 w2"></i><i class="s2 w1"></i><i class="s3 w1"></i>
        <!-- конец -->
        <i class="long s2 w1"></i><i class="long s1 w1"></i>
      </div>
    </div>

    <style>
      .barcode {
        container-type: inline-size;
        width: 80%;
        background: #fff;
        display: flex;
        justify-content: center;
        align-self: center;
      }
      .bars {
        --u: calc(100cqw / 113);
        display: flex;
        align-items: flex-start;
        padding: calc(9 * var(--u));
      }
      .bars i {
        display: block;
        height: calc(50 * var(--u));
        background: #000;
        width: calc(var(--w) * var(--u));
        margin-left: calc(var(--s) * var(--u));
      }
      .bars i.long {
        height: calc(56 * var(--u));
      }
      .w1 {
        --w: 1;
      }
      .w2 {
        --w: 2;
      }
      .w3 {
        --w: 3;
      }
      .w4 {
        --w: 4;
      }
      .s0 {
        --s: 0;
      }
      .s1 {
        --s: 1;
      }
      .s2 {
        --s: 2;
      }
      .s3 {
        --s: 3;
      }
    </style>
  </body>
</html>
